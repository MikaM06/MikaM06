name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3E9CDE&color_dots=#161B22,#0E3A5C,#155A8A,#2B7FC0,#3E9CDE
            dist/snake-light.svg?palette=github-light&color_snake=#1C7ED6&color_dots=#EBEDF0,#C6E0F5,#8CC1EB,#4A9BDC,#1C7ED6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
