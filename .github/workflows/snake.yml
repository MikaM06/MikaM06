name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8A5B&color_dots=#1A0E10,#4A1216,#7A1B20,#B5282E,#E5484D
            dist/snake-light.svg?palette=github-light&color_snake=#F2663B&color_dots=#FBE9E8,#F4C2BF,#E88A86,#DD4F52,#D4262E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
