<svg xmlns="http://www.w3.org/2000/svg" width="590" height="234" viewBox="0 0 590 234">
<style>
  .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  
  .beam { transform-origin: 480px 176px; animation: sweep 2.4s ease-in-out infinite alternate; }
